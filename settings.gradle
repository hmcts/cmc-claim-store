pluginManagement {
  repositories {
    mavenLocal()
    mavenCentral()
    gradlePluginPortal()
    maven {
      url "https://pkgs.dev.azure.com/hmcts/Artifacts/_packaging/hmcts-lib/maven/v1"
    }
    maven {
      url "https://artifactory.platform.hmcts.net/artifactory/maven-remotes"
    }
  }
}

plugins {
  // Lets Gradle download the JDK 25 toolchain when it isn't installed locally
  id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'claim-store'
include 'email-client'
include 'domain-model'
include 'domain-sample-data'
include 'ccd-adapter'
include 'rpa-mapper'
include 'job-scheduler'
include 'ccd-sample-data'
include 'launch-darkly-client'
